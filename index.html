<DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo de Bloco</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0b0f19;
        }
        .hidden-screen {
            display: none !important;
        }

        /* Modern Grid & Piece Animations */
        .grid-cell {
            background-color: #1e293b;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        .grid-cell.filled {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.25), 0 4px 6px rgba(0, 0, 0, 0.4);
        }
        @keyframes clear-row {
            0% { transform: scale(1); filter: brightness(2); }
            50% { transform: scale(1.1); filter: brightness(3); }
            100% { transform: scale(0); filter: brightness(1); }
        }
        .piece-preview {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .piece-preview.selected {
            transform: scale(1.08);
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.6));
        }

        /* Custom Scrollbars */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-100 h-screen w-screen relative overflow-hidden bg-slate-950 select-none">

    <!-- ========================================== -->
    <!-- SCREEN 1: MODERN BLOCK PUZZLE (DISGUISE)   -->
    <!-- ========================================== -->
    <div id="screen-game" class="flex flex-col h-full w-full max-w-md mx-auto p-3 justify-between">
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-lg font-black tracking-wide bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Jogo de Bloco
                </h1>
                <div class="flex gap-4 text-xs font-semibold text-slate-400 mt-0.5">
                    <span>Pontos: <strong id="game-score" class="text-indigo-400 text-sm">0</strong></span>
                    <span>Recorde: <strong id="game-high" class="text-amber-400 text-sm">0</strong></span>
                </div>
            </div>
            <button id="btn-sair" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold tracking-wide transition active:scale-95 shadow-md">
                Sair
            </button>
        </header>

        <!-- Main 8x8 Board -->
        <main class="flex-1 flex flex-col items-center justify-center my-2">
            <div id="board-container" class="grid grid-cols-8 gap-1 bg-slate-900 p-2.5 rounded-2xl border border-slate-800 shadow-2xl w-full aspect-square max-w-[340px]">
                <!-- Cells rendered via JS -->
            </div>
            
            <!-- Pieces Container -->
            <div id="pieces-container" class="flex justify-around items-center w-full max-w-[340px] mt-4 min-h-[90px] bg-slate-900/50 p-2 rounded-2xl border border-slate-800/60">
                <!-- 3 Available Random Pieces Slot -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-900/80 p-2.5 rounded-2xl border border-slate-800/80 flex justify-between items-center">
            <button id="btn-restart" class="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg transition active:scale-95">
                Novo Jogo
            </button>
        </footer>
    </div>
